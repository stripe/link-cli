name: ARM64 packaging experiment

on:
  push:
    branches: [stevekaliski-arm64-packaging-probes]

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@stripe/link-cli...
      - run: pnpm --filter @stripe/link-cli run build:sea

      - name: Prepare controls and candidate executables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe-binaries probe-evidence
          test "$(node --version)" = v26.13.0
          test "$(node -p 'process.arch')" = arm64
          curl -fL --retry 2 --max-time 180 \
            'https://github.com/stripe/link-cli/releases/download/%40stripe/link-cli%401.4.1/link-cli-linux-arm64' \
            -o probe-binaries/original
          printf '%s\n' '24cde296cdf73c57dd86404604c0c2b4b7307d8ae033852b19bab6bcd2eae899  probe-binaries/original' | sha256sum -c -
          cp "$(node -p 'process.execPath')" probe-binaries/stock-node
          cp probe-binaries/original probe-binaries/candidate-current-repair
          node scripts/fix-sea-elf.mjs probe-binaries/candidate-current-repair
          python3 .github/scripts/arm64-probe/common-bias.py \
            probe-binaries/original probe-binaries/candidate-common-bias
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const config = JSON.parse(readFileSync('packages/cli/sea-config.json', 'utf8'));
          config.output = 'probe.blob';
          writeFileSync('probe-sea.json', JSON.stringify(config));
          NODE
          node --experimental-sea-config probe-sea.json
          npm install --prefix "$RUNNER_TEMP/postject-probe" --ignore-scripts \
            --no-audit --no-fund postject@1.0.0-alpha.6
          cp probe-binaries/stock-node probe-binaries/candidate-postject
          node "$RUNNER_TEMP/postject-probe/node_modules/postject/dist/cli.js" \
            probe-binaries/candidate-postject NODE_SEA_BLOB probe.blob \
            --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2
          chmod +x probe-binaries/*
          sha256sum probe-binaries/* | tee probe-evidence/binary-checksums.txt

      - name: Native 4 KiB host startup checks
        shell: bash
        run: |
          set -euo pipefail
          uname -a | tee probe-evidence/native-host.txt
          getconf PAGESIZE | tee -a probe-evidence/native-host.txt
          test "$(getconf PAGESIZE)" = 4096
          failed=0
          for binary in probe-binaries/*; do
            name=${binary##*/}
            version_rc=0
            help_rc=0
            timeout 90 "$binary" --version > "probe-evidence/native-$name-version.txt" 2>&1 || version_rc=$?
            timeout 90 "$binary" --help > "probe-evidence/native-$name-help.txt" 2>&1 || help_rc=$?
            printf 'RESULT name=%s page=4096 version_exit=%s help_exit=%s\n' "$name" "$version_rc" "$help_rc" | tee -a probe-evidence/native-results.txt
            if [ "$version_rc" != 0 ] || [ "$help_rc" != 0 ]; then failed=1; fi
          done
          echo "$failed" > probe-evidence/native-failed

      - name: Install full-system emulator and guest tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-arm busybox-static cpio binutils libatomic1

      - name: Real 64 KiB ARM64 kernel under full-system emulation
        run: bash .github/scripts/arm64-probe/verify-64k.sh probe-binaries probe-evidence/64k

      - name: Check native host result
        run: test "$(cat probe-evidence/native-failed)" = 0

      - name: Upload comparison evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arm64-packaging-comparison
          path: probe-evidence/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload candidate binaries
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arm64-packaging-candidates
          path: probe-binaries/candidate-*
          retention-days: 7
          if-no-files-found: warn
