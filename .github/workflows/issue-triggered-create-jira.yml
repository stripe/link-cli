name: Sync GitHub issue to Jira via tmkv2

on:
  issues:
    types: [opened, closed, reopened]

permissions:
  contents: read

# Serialize events per issue so a close can't race ahead of the create.
concurrency:
  group: jira-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  post_to_api:
    runs-on: ubuntu-latest
    steps:
      - name: Send Issue Data via Signed Curl
        env:
          API_KEY: ${{ secrets.TMV2_PROD_API_KEY }}
          API_ENDPOINT: ${{ secrets.TMV2_PROD_API_ENDPOINT }}
          EVENT_ACTION: ${{ github.event.action }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_STATE_REASON: ${{ github.event.issue.state_reason }}
          ISSUE_SENDER: ${{ github.event.sender.login }}
        run: |
          MAX_ATTEMPTS=4
          RETRY_DELAY=120

          # Stable per-issue digest so ticket-maker can find the ticket again on close.
          DIGEST="link-cli-github-issue-$ISSUE_NUMBER"

          # Build the JSON body using jq for safe escaping of special characters
          case "$EVENT_ACTION" in
            opened|reopened)
              if [ -z "$(printf '%s' "$ISSUE_BODY" | tr -d '[:space:]')" ]; then
                echo "Issue #$ISSUE_NUMBER has no description; skipping Jira ticket."
                exit 0
              fi

              # A resolved ticket can't be reopened by digest (ticket-maker only
              # matches tickets that aren't Done), so a reopen files a new ticket.
              if [ "$EVENT_ACTION" = "reopened" ]; then
                SUMMARY_PREFIX="Reopened GitHub Issue: "
                NOTE="Issue #$ISSUE_NUMBER opened by $ISSUE_AUTHOR was reopened on GitHub by $ISSUE_SENDER."
              else
                SUMMARY_PREFIX="New GitHub Issue: "
                NOTE="Issue #$ISSUE_NUMBER opened by $ISSUE_AUTHOR."
              fi

              BODY=$(jq -n \
                --arg title "$ISSUE_TITLE" \
                --arg prefix "$SUMMARY_PREFIX" \
                --arg note "$NOTE" \
                --arg url "$ISSUE_URL" \
                --arg body "$ISSUE_BODY" \
                --arg digest "$DIGEST" \
                '{
                  project: "PQ",
                  summary: ($prefix + $title),
                  description: ($note + "\n*URL:* " + $url + ".\n*Body:*\n\n" + $body),
                  issuetype: "Bug",
                  labels: ["project-RUN_LINK_AGENT_WALLET"],
                  digest: $digest
                }')
              ;;
            closed)
              BODY=$(jq -n \
                --arg number "$ISSUE_NUMBER" \
                --arg sender "$ISSUE_SENDER" \
                --arg reason "${ISSUE_STATE_REASON:-unspecified}" \
                --arg url "$ISSUE_URL" \
                --arg digest "$DIGEST" \
                '{
                  digest: $digest,
                  resolved: true,
                  resolve_message: ("GitHub issue #" + $number + " was closed by " + $sender + " (reason: " + $reason + ").\n*URL:* " + $url)
                }')
              ;;
            *)
              echo "Unhandled issue action: $EVENT_ACTION"
              exit 0
              ;;
          esac

          SIG=$(printf '%s' "$BODY" | openssl dgst -sha256 -mac HMAC -macopt hexkey:$API_KEY -binary | openssl base64 -A)

          for ATTEMPT in $(seq 1 $MAX_ATTEMPTS); do
            echo "--- Attempt $ATTEMPT of $MAX_ATTEMPTS ---"

            HTTP_STATUS=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
              -X POST "$API_ENDPOINT" \
              -H "Content-Type: application/json" \
              -H "X-TM-Signature: $SIG" \
              --data-raw "$BODY")

            echo "HTTP Status: $HTTP_STATUS"
            echo "Response: $(cat /tmp/response.txt)"

            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
              echo "Request succeeded on attempt $ATTEMPT."
              exit 0
            fi

            # 422 means no open ticket has this digest: the issue was skipped for
            # having no description, predates digests, or was already resolved.
            if [ "$EVENT_ACTION" = "closed" ] && [ "$HTTP_STATUS" = "422" ]; then
              echo "No open Jira ticket found for $DIGEST; nothing to resolve."
              exit 0
            fi

            echo "Request failed with HTTP $HTTP_STATUS."

            if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
              echo "Waiting $RETRY_DELAY seconds before retry..."
              sleep $RETRY_DELAY
            fi
          done

          echo "All $MAX_ATTEMPTS attempts failed. Marking job as failed."
          exit 1

      - name: Send Slack Failure Notification via Webhook
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_LINK_PQ_WEBHOOK_URL }}
          GITHUB_EVENT_ISSUE_HTML_URL: ${{ github.event.issue.html_url }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          PAYLOAD=$(jq -n \
            --arg issue_url "$GITHUB_EVENT_ISSUE_HTML_URL" \
            --arg action "$EVENT_ACTION" \
            '{text: ("❌ ACTION REQUIRED: Jira sync (" + $action + ") failed for " + $issue_url + ". Re-run the failed jobs via https://github.com/stripe/link-cli/actions/workflows/issue-triggered-create-jira.yml.")}')

          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            --data-raw "$PAYLOAD"
