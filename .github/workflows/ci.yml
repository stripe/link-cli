name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-sdk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    defaults:
      run:
        working-directory: packages/sdk-python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.9.22'
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: packages/sdk-python/uv.lock

      - run: uv python install
      - run: uv sync --locked
      - run: uv run --locked pytest
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked ty check
      - run: uv build
      - name: Smoke test built wheel
        run: uv run --isolated --no-project --with dist/*.whl tests/smoke_test.py

  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6
        with:
          go-version-file: packages/sdk-go/go.mod
          cache-dependency-path: packages/sdk-go/go.mod

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo run build
      - run: pnpm turbo run typecheck
      - run: pnpm biome check .
      - run: pnpm turbo run test

      - name: Check Go SDK
        run: |
          unformatted="$(gofmt -l packages/sdk-go/*.go)"
          if [ -n "$unformatted" ]; then
            echo "The following Go files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
          go -C packages/sdk-go mod tidy -diff
          go -C packages/sdk-go vet ./...

      - name: Test Go SDK
        working-directory: packages/sdk-go
        run: go test -race ./...

      - name: Verify publishable
        run: pnpm --filter @stripe/link-cli --filter @stripe/link-sdk --filter @stripe/link-integrations-better-auth publish --dry-run --no-git-checks
