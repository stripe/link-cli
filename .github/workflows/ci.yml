name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux-binary:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.13.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@stripe/link-cli...
      - run: pnpm --filter @stripe/link-cli run build:sea
      - name: Build Linux binary
        run: |
          test "$(node -p 'process.arch')" = "${{ matrix.arch }}"
          if [ "${{ matrix.arch }}" = arm64 ]; then
            # Temporary workaround: https://github.com/nodejs/node/issues/67048
            node --experimental-sea-config packages/cli/sea-config.json
            mv sea-output sea-prep.blob
            cp "$(node -p 'process.execPath')" sea-output
            pnpm exec postject sea-output NODE_SEA_BLOB sea-prep.blob \
              --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2
          else
            node --build-sea packages/cli/sea-config.json
          fi
          chmod +x sea-output
      # Temporary guard: https://github.com/nodejs/node/issues/67048
      - name: Check ARM64 ELF page compatibility
        if: matrix.arch == 'arm64'
        run: node scripts/check-arm64-sea.mjs sea-output
      - name: Smoke test binary
        run: |
          uname -a
          getconf PAGESIZE
          ./sea-output --version
          ./sea-output --help
      - name: Package test binary
        run: |
          mv sea-output link-cli-linux-${{ matrix.arch }}
          sha256sum link-cli-linux-${{ matrix.arch }} > link-cli-linux-${{ matrix.arch }}.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: link-cli-linux-${{ matrix.arch }}
          path: |
            link-cli-linux-${{ matrix.arch }}
            link-cli-linux-${{ matrix.arch }}.sha256
          if-no-files-found: error

  # Exercise the kernels affected by https://github.com/nodejs/node/issues/67048.
  # Run this against the upstream-fixed --build-sea output before removing the workaround.
  arm64-large-page-smoke:
    needs: linux-binary
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - page: 16384
            image: debian:trixie
            package: linux-image-arm64-16k
            kernel_config: CONFIG_ARM64_16K_PAGES
          - page: 65536
            image: ubuntu:24.04
            package: linux-image-generic-64k
            kernel_config: CONFIG_ARM64_64K_PAGES
    env:
      EXPECTED_PAGE: ${{ matrix.page }}
      KERNEL_IMAGE: ${{ matrix.image }}
      KERNEL_PACKAGE: ${{ matrix.package }}
      KERNEL_CONFIG: ${{ matrix.kernel_config }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: link-cli-linux-arm64
          path: artifact
      - name: Verify exact CI artifact
        working-directory: artifact
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          sha256sum -c link-cli-linux-arm64.sha256
          chmod +x link-cli-linux-arm64
      - name: Install QEMU and obtain large-page kernel
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-arm busybox-static cpio
          docker run --name kernel-source --platform linux/arm64 -e DEBIAN_FRONTEND=noninteractive "$KERNEL_IMAGE" \
            sh -euxc 'apt-get update; apt-get install -y --no-install-recommends "$1"' sh "$KERNEL_PACKAGE"
          mkdir kernel
          docker cp kernel-source:/boot/. kernel/
          kernel_paths=(kernel/vmlinuz-*)
          test "${#kernel_paths[@]}" -eq 1
          kernel_path="${kernel_paths[0]}"
          test -f "$kernel_path"
          kernel_release="${kernel_path#kernel/vmlinuz-}"
          grep -Fx "$KERNEL_CONFIG=y" "kernel/config-$kernel_release"
          cp "$kernel_path" vmlinuz
          {
            printf 'Kernel: %s\nPage config: %s\n' "$kernel_release" "$KERNEL_CONFIG"
            docker inspect --format 'Container image: {{.Image}}' kernel-source
            sha256sum vmlinuz
            qemu-system-aarch64 --version
          } | tee kernel-info.txt
      - name: Build minimal guest initramfs
        run: |
          set -euo pipefail
          mkdir -p guest/bin guest/artifact guest/proc guest/sys guest/dev guest/tmp
          cp /bin/busybox guest/bin/busybox
          for applet in sh mount uname cat grep sha256sum poweroff sync; do
            ln -s busybox "guest/bin/$applet"
          done
          cp /usr/bin/getconf guest/bin/getconf
          cp artifact/link-cli-linux-arm64 artifact/link-cli-linux-arm64.sha256 guest/artifact/
          for executable in artifact/link-cli-linux-arm64 /usr/bin/getconf; do
            ldd "$executable" | awk '$2 == "=>" && substr($3,1,1) == "/" {print $3} substr($1,1,1) == "/" {print $1}' |
              while read -r library; do cp --parents -L "$library" guest/; done
          done
          printf '%s\n' "$EXPECTED_PAGE" > guest/expected-page
          jq -er .version packages/cli/package.json > guest/expected-version
          cat > guest/init <<'GUEST'
          #!/bin/sh
          set -eu
          export PATH=/bin HOME=/tmp TMPDIR=/tmp
          expected=$(cat /expected-page)
          finish() {
            status=$?
            trap - EXIT
            if [ "$status" -eq 0 ]; then
              echo "SEA_LARGE_PAGE_PASS:$expected"
            else
              echo "SEA_LARGE_PAGE_FAIL:$expected"
            fi
            sync
            poweroff -f
            exit "$status"
          }
          trap finish EXIT
          mount -t proc proc /proc
          mount -t sysfs sysfs /sys
          mount -t devtmpfs devtmpfs /dev
          ulimit -c 0
          arch=$(uname -m)
          page=$(getconf PAGESIZE)
          uname -a
          echo "ARCH=$arch PAGE_SIZE=$page EXPECTED=$expected"
          [ "$arch" = aarch64 ]
          [ "$page" = "$expected" ]
          cd /artifact
          sha256sum -c link-cli-linux-arm64.sha256
          version_status=0
          help_status=0
          ./link-cli-linux-arm64 --version > /tmp/version.txt 2>&1 || version_status=$?
          ./link-cli-linux-arm64 --help > /tmp/help.txt 2>&1 || help_status=$?
          cat /tmp/version.txt /tmp/help.txt
          echo "VERSION_EXIT=$version_status HELP_EXIT=$help_status"
          [ "$version_status" -eq 0 ]
          [ "$help_status" -eq 0 ]
          [ "$(cat /tmp/version.txt)" = "$(cat /expected-version)" ]
          grep -Eq '^Usage: link-cli( |$)' /tmp/help.txt
          GUEST
          chmod +x guest/init
          (cd guest && find . -print0 | cpio --null -o --format=newc --owner=0:0 | gzip -1) > initramfs.cpio.gz
      - name: Boot guest and run CLI
        run: |
          set -euo pipefail
          timeout 600 qemu-system-aarch64 \
            -machine virt -cpu max -accel tcg -smp 2 -m 4096 \
            -nographic -no-reboot -nic none \
            -kernel vmlinuz -initrd initramfs.cpio.gz \
            -append 'console=ttyAMA0 rdinit=/init panic=-1' \
            2>&1 | tr -d '\r' | tee guest-console.txt
          grep -Fx "SEA_LARGE_PAGE_PASS:$EXPECTED_PAGE" guest-console.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: arm64-${{ matrix.page }}-page-smoke-log
          path: |
            guest-console.txt
            kernel-info.txt
          if-no-files-found: warn

  windows-continuations:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@stripe/link-cli...
      - run: pnpm --dir packages/cli test src/utils/__tests__/command-continuation.test.ts src/utils/__tests__/shell-quote.test.ts src/__tests__/continuation.test.ts src/commands/mpp/decode.test.ts src/commands/insights/__tests__/upgrade-command.test.ts

  python-sdk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    defaults:
      run:
        working-directory: packages/sdk-python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.9.22'
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: packages/sdk-python/uv.lock

      - run: uv python install
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked ty check
      - run: uv run --locked python -m unittest discover -s scripts
      - run: uv build
      - run: uv run --locked twine check --strict dist/*
      - run: uv run --locked python scripts/release.py validate
      - name: Test built wheel
        run: uv run --locked python scripts/test_wheel.py dist/*.whl

  agent-identity-node22:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @stripe/agent-identity...
      - run: pnpm --filter @stripe/agent-identity build
      # Build on the workspace runtime; test the SDK's supported consumer runtime.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Verify Agent Identity on Node 22
        working-directory: packages/agent-identity
        run: |
          node node_modules/vitest/vitest.mjs run
          node --test example/step-up/server.test.mjs
          node scripts/check-package.mjs
          node scripts/check-docs.mjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.0.0
      - name: Verify package on minimum supported Node
        working-directory: packages/agent-identity
        run: node scripts/check-package.mjs

  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6
        with:
          go-version-file: packages/sdk-go/go.mod
          cache-dependency-path: packages/sdk-go/go.mod

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo run build
      - run: pnpm turbo run typecheck
      - run: pnpm biome check .
      - run: pnpm turbo run test
      - name: Test ARM64 ELF page guard
        run: node --test scripts/check-arm64-sea.test.mjs
      - name: Check Agent Identity package, examples, and documentation
        working-directory: packages/agent-identity
        run: |
          node --test example/step-up/server.test.mjs
          node scripts/check-docs.mjs
          node scripts/check-package.mjs
      - name: Test wallet and verifier integration
        working-directory: packages/agent-identity
        run: node --test test/wallet.test.mjs

      - name: Check Go SDK
        run: |
          unformatted="$(gofmt -l packages/sdk-go/*.go)"
          if [ -n "$unformatted" ]; then
            echo "The following Go files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
          go -C packages/sdk-go mod tidy -diff
          go -C packages/sdk-go vet ./...

      - name: Test Go SDK
        working-directory: packages/sdk-go
        run: go test -race ./...

      - name: Verify publishable
        run: pnpm --filter @stripe/link-cli --filter @stripe/link-sdk --filter @stripe/link-integrations-better-auth --filter @stripe/link-integrations-eve --filter @stripe/link-integrations-mastra --filter @stripe/agent-identity publish --dry-run --no-git-checks
