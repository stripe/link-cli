name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
  # Opens or updates the "Version Packages" PR. Never publishes and never
  # pushes to main, so it does not run in the protected `npm` environment.
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      hasChangesets: ${{ steps.changesets.outputs.has-changesets }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Create or update release PR
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pr-title: 'Version Packages'
          commit-message: 'Version Packages'
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # Only request approval for the `npm` environment when a package version
  # on main is not yet on the registry.
  check:
    needs: version
    if: needs.version.outputs.hasChangesets == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.unpublished.outputs.publish }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check for unpublished package versions
        id: unpublished
        run: |
          publish=false
          for manifest in packages/*/package.json packages/integrations/*/package.json; do
            [ -f "$manifest" ] || continue
            if [ "$(jq -r '.private // false' "$manifest")" = "true" ]; then
              continue
            fi
            name=$(jq -r .name "$manifest")
            version=$(jq -r .version "$manifest")
            if [ -z "$(npm view "$name@$version" version 2>/dev/null)" ]; then
              echo "$name@$version is not published"
              publish=true
            fi
          done
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  publish:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      publishedPackages: ${{ steps.changesets.outputs.published-packages }}
      cliPublished: ${{ steps.cli_published.outputs.value }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo run build

      - name: Publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: pnpm changeset publish
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether the CLI was published
        id: cli_published
        if: steps.changesets.outputs.published == 'true'
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
        run: |
          cli_published="$(jq -r 'any(.[]; .name == "@stripe/link-cli")' <<<"$PUBLISHED_PACKAGES")"
          echo "value=$cli_published" >> "$GITHUB_OUTPUT"

      - name: Upload built CLI to GitHub Release
        if: steps.cli_published.outputs.value == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STEPS_CHANGESETS_OUTPUTS_PUBLISHEDPACKAGES: ${{ steps.changesets.outputs.published-packages }}
        run: |
          TAG=$(printf '%s' "$STEPS_CHANGESETS_OUTPUTS_PUBLISHEDPACKAGES" \
            | jq -r '.[] | select(.name == "@stripe/link-cli") | "@stripe/link-cli@" + .version')
          if [ -n "$TAG" ]; then
            sha256sum packages/cli/dist/cli.js > packages/cli/dist/cli.js.sha256
            gh release upload "$TAG" packages/cli/dist/cli.js packages/cli/dist/cli.js.sha256 --clobber
          fi

      # GitHub marks the newest release as Latest, so SDK and Eve releases
      # would otherwise break /releases/latest/download/<cli-asset> URLs.
      - name: Keep the CLI release marked as Latest
        if: steps.changesets.outputs.published == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("@stripe/link-cli@"))] | sort_by(.createdAt) | last | .tagName // empty')
          if [ -n "$TAG" ]; then
            gh release edit "$TAG" --latest
          fi

  build-sea:
    needs: publish
    if: needs.publish.outputs.cliPublished == 'true'
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: link-cli-linux-x64
          - os: ubuntu-24.04-arm
            asset_name: link-cli-linux-arm64
          - os: macos-latest
            asset_name: link-cli-macos-arm64
          - os: windows-latest
            asset_name: link-cli-win-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build
      - run: pnpm --filter @stripe/link-cli run build:sea

      - name: Build SEA
        if: matrix.asset_name != 'link-cli-linux-arm64'
        run: node --build-sea packages/cli/sea-config.json

      - name: Build ARM64 SEA with postject
        if: matrix.asset_name == 'link-cli-linux-arm64'
        run: |
          node --experimental-sea-config packages/cli/sea-config.json
          mv sea-output sea-prep.blob
          cp "$(node -p 'process.execPath')" sea-output
          pnpm exec postject sea-output NODE_SEA_BLOB sea-prep.blob \
            --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: mv sea-output ${{ matrix.asset_name }} && chmod +x ${{ matrix.asset_name }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Rename-Item sea-output ${{ matrix.asset_name }}

      - name: Sign binary (macOS only)
        if: runner.os == 'macOS'
        run: codesign --sign - ${{ matrix.asset_name }}

      - name: Smoke test binary
        shell: bash
        run: |
          ./${{ matrix.asset_name }} --version
          ./${{ matrix.asset_name }} --help

      - name: Generate checksum
        shell: bash
        run: sha256sum ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256
          if-no-files-found: error

  upload-sea:
    needs: [publish, build-sea]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: sea
          merge-multiple: true

      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEEDS_PUBLISH_OUTPUTS_PUBLISHEDPACKAGES: ${{ needs.publish.outputs.publishedPackages }}
        run: |
          TAG=$(printf '%s' "$NEEDS_PUBLISH_OUTPUTS_PUBLISHEDPACKAGES" \
            | jq -r '.[] | select(.name == "@stripe/link-cli") | "@stripe/link-cli@" + .version')
          gh release upload "$TAG" sea/* --repo "$GITHUB_REPOSITORY" --clobber
